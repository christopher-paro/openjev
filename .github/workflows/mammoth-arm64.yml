# The mammoth-1 server for the DGX Spark. No attestations: the in-cluster registry mirror refuses them.
name: mammoth-arm64
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mammoth/**", ".github/workflows/mammoth-arm64.yml"]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Free disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache; df -h /
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - run: |
          docker buildx build --platform linux/arm64 --provenance=false --sbom=false --push \
            -t ghcr.io/christopher-paro/mammoth-1-server:arm64-${GITHUB_SHA::12} mammoth
